<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>学習発表会 動画・音源</title>
<style>
  :root { --bg:#f6f3ec; --card:#fff; --ink:#2b2a28; --sub:#7a756c; --accent:#6a7fd8; --line:#e6e0d4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif; padding:24px 16px 48px; }
  main { max-width:880px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  h2 { font-size:1rem; margin:18px 0 8px; color:var(--sub); }
  .lead { color:var(--sub); margin:0 0 12px; font-size:.9rem; }
  button { font:inherit; font-size:.95rem; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer; color:inherit; }
  button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .list { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
  .item { text-align:left; padding:14px 16px; }
  .item small { display:block; color:var(--sub); margin-top:2px; }
  .item.active { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .empty { color:var(--sub); font-size:.85rem; padding:10px 0; }
  .stage { margin-top:20px; background:#000; border-radius:12px; overflow:hidden; aspect-ratio:16/9; }
  video { width:100%; height:100%; display:block; background:#000; }
  .audio { margin-top:20px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px 16px; text-align:center; }
  .audio .t { font-size:1.2rem; font-weight:bold; margin-bottom:14px; }
  audio { width:100%; }
  .tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
  .tools .label { color:var(--sub); font-size:.85rem; margin-right:2px; }
  .note { color:var(--sub); font-size:.8rem; margin-top:16px; }
  .lyrics { margin-top:12px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .lyrics .head { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; }
  .lyrics .head b { font-size:1rem; }
  .lyrics .head .btns { display:flex; gap:6px; }
  .lyrics .head button { padding:6px 12px; font-size:.85rem; }
  .ltext { white-space:pre-wrap; font-size:var(--lsize,1.4rem); line-height:1.9; margin-top:10px; max-height:60vh; overflow:auto; }
  .ltext.empty { font-size:.9rem; color:var(--sub); }
  textarea { width:100%; min-height:260px; margin-top:10px; font:inherit; font-size:1rem; line-height:1.7; padding:10px; border:1px solid var(--line); border-radius:8px; }
  .lnote { color:var(--sub); font-size:.75rem; margin-top:8px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>🌈 学習発表会 動画・音源</h1>
  <p class="lead">「虹の向こうの宝もの」練習用。教職員向け・持ち出し厳禁。</p>

  <h2>🎵 合奏</h2>
  <div class="list" id="list-gasso"></div>
  <h2>🎤 合唱</h2>
  <div class="list" id="list-gassho"></div>

  <div class="stage" id="vstage"><video id="video" controls playsinline preload="metadata" controlsList="nodownload"></video></div>
  <div class="audio" id="astage" hidden><div class="t" id="atitle"></div><audio id="audio" controls preload="metadata" controlsList="nodownload"></audio></div>

  <div class="lyrics" id="lyrics" hidden>
    <div class="head">
      <b>📄 かし</b>
      <div class="btns">
        <button id="lsmall" title="文字を小さく">A−</button>
        <button id="lbig" title="文字を大きく">A＋</button>
        <button id="ledit">書く・直す</button>
      </div>
    </div>
    <div class="ltext" id="ltext"></div>
    <div id="lform" hidden>
      <textarea id="larea" placeholder="ここに歌詞を書くか、貼りつけてください"></textarea>
      <div class="tools"><button id="lsave" class="on">保存</button><button id="lcancel">やめる</button></div>
    </div>
    <p class="lnote">※ 歌詞はこの端末（このブラウザ）の中だけに保存されます。ネットには公開されず、ほかの端末には出ません。</p>
  </div>

  <div class="tools">
    <span class="label">速さ</span>
    <button data-rate="0.5">0.5倍</button>
    <button data-rate="0.75">0.75倍</button>
    <button data-rate="1" class="on">ふつう</button>
  </div>
  <p class="note">※ 切り替えても速さはそのまま引き継がれます。</p>
</main>
<script>
// type: 'video' か 'audio'。group: 'gasso'（合奏）か 'gassho'（合唱）
const ITEMS = [
  { id:'gasso1', group:'gasso', type:'video', title:'合奏（初回）', sub:'2分27秒', src:'media/gasso1.mp4' },
  { id:'gassho1', group:'gassho', type:'audio', title:'1. 崖の上のポニョ', sub:'2分43秒', src:'media/gassho1.mp3' },
  { id:'gassho2', group:'gassho', type:'audio', title:'2. 君をのせて', sub:'2分13秒', src:'media/gassho2.mp3' },
  { id:'gassho3', group:'gassho', type:'audio', title:'3. カントリー・ロード', sub:'3分07秒', src:'media/gassho3.mp3' },
  { id:'gassho4', group:'gassho', type:'audio', title:'4. いつでも誰かが', sub:'3分45秒', src:'media/gassho4.mp3' },
];
const video = document.getElementById('video'), audio = document.getElementById('audio');
const vstage = document.getElementById('vstage'), astage = document.getElementById('astage');
let rate = 1, cur;
video.oncontextmenu = audio.oncontextmenu = e => e.preventDefault();
function render() {
  ['gasso','gassho'].forEach(g => {
    const list = document.getElementById('list-' + g);
    const items = ITEMS.filter(v => v.group === g);
    list.innerHTML = items.length ? '' : '<div class="empty">じゅんびちゅう</div>';
    items.forEach(v => {
      const b = document.createElement('button');
      b.className = 'item' + (cur === v.id ? ' active' : '');
      b.innerHTML = `<b>${v.title}</b><small>${v.sub}</small>`;
      b.onclick = () => select(v);
      list.appendChild(b);
    });
  });
}
function select(v) {
  if (cur === v.id) return;
  cur = v.id; render();
  video.pause(); audio.pause();
  const isA = v.type === 'audio';
  vstage.hidden = isA; astage.hidden = !isA;
  const el = isA ? audio : video;
  if (isA) document.getElementById('atitle').textContent = v.title;
  el.src = v.src; el.playbackRate = rate;
  showLyrics(v);
}
// 歌詞：端末内（localStorage）だけに保存
const LKEY = 'gakushu-lyrics-', lyr = document.getElementById('lyrics'), ltext = document.getElementById('ltext');
const lform = document.getElementById('lform'), larea = document.getElementById('larea');
const ledit = document.getElementById('ledit');
let lsize = 1.4, curItem;
const lget = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lset = (k, v) => { try { localStorage.setItem(k, v); return true; } catch(e) { return false; } };
const s0 = parseFloat(lget(LKEY + 'size')); if (s0) lsize = s0;
function applySize() { ltext.style.setProperty('--lsize', lsize + 'rem'); }
function showLyrics(v) {
  curItem = v;
  lyr.hidden = v.type !== 'audio';
  lform.hidden = true; ltext.hidden = false; ledit.hidden = false;
  const t = lget(LKEY + v.id) || '';
  ltext.textContent = t || '歌詞はまだありません。「書く・直す」から入れられます。';
  ltext.classList.toggle('empty', !t);
  applySize();
}
ledit.onclick = () => {
  larea.value = lget(LKEY + curItem.id) || '';
  lform.hidden = false; ltext.hidden = true; ledit.hidden = true; larea.focus();
};
document.getElementById('lcancel').onclick = () => showLyrics(curItem);
document.getElementById('lsave').onclick = () => {
  if (!lset(LKEY + curItem.id, larea.value.trim())) alert('この端末では保存できませんでした（プライベートモードなど）。');
  showLyrics(curItem);
};
document.getElementById('lbig').onclick = () => { lsize = Math.min(3, lsize + 0.2); lset(LKEY + 'size', lsize); applySize(); };
document.getElementById('lsmall').onclick = () => { lsize = Math.max(0.9, lsize - 0.2); lset(LKEY + 'size', lsize); applySize(); };
video.onloadedmetadata = audio.onloadedmetadata = e => { e.target.playbackRate = rate; };
document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => {
  rate = +b.dataset.rate; video.playbackRate = rate; audio.playbackRate = rate;
  document.querySelectorAll('[data-rate]').forEach(x => x.classList.toggle('on', x === b));
});
select(ITEMS[0]);
</script>
</body>
</html>
